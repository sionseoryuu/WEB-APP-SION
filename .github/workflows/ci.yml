name: CI
on: [push, pull_request]
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node tests/t_v71.mjs
      - run: node tests/t_v2.mjs
      - run: node tests/t_accounting.mjs
      - run: npm run build
